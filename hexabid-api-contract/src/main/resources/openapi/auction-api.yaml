      type: object
      required:
        - ruleName
        - message
        - blocking
        - requiredAction
        - status
        - severity
      properties:
        ruleName:
          type: string
          description: Unique identifier of the rule
          example: "WADIUM_10_PERCENT_ABOVE_10K"
        message:
          type: string
          description: Human-readable rule evaluation message
        blocking:
          type: boolean
          description: Whether this violation blocks the associated action
        requiredAction:
          type: string
          description: Action required to satisfy this rule (non-empty for PENDING rules)
        status:
          $ref: '#/components/schemas/RuleStatus'
        severity:
          $ref: '#/components/schemas/RuleSeverity'
    RulePhaseEvaluation:
      type: object
      required:
