server:
  servlet:
    session:
      cookie:
        path: /

logging:
  file:
    name: /work/var/log/hexabid.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.github.hexabid: DEBUG

spring:
  application:
    name: hexabid
  datasource:
    url: jdbc:h2:mem:auctions;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:change-me}
            client-secret: ${GITHUB_CLIENT_SECRET:change-me}
            scope:
              - read:user
              - user:email
          dev:
            client-name: Dev
            client-id: dev-client
            client-secret: dev-secret
            provider: custom-dev
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
        provider:
          custom-dev:
            authorization-uri: ${DEV_OIDC_AUTHORIZATION_URI:http://localhost:18080/hexabid/login/dev}
            token-uri: ${DEV_OIDC_TOKEN_URI:http://localhost:18080/hexabid/login/dev/token}
            user-info-uri: ${DEV_OIDC_USER_INFO_URI:http://localhost:18080/hexabid/login/dev/userinfo}
            jwk-set-uri: ${DEV_OIDC_JWK_SET_URI:http://localhost:18080/hexabid/login/dev/certs}
            user-name-attribute: preferred_username


auctions:
  api:
    version:
      current: "1"
  jobs:
    close-expired:
      delay: 60000
  seed:
    enabled: false
  kafka:
    topics:
      outbid: auctions.outbid
      ended: auctions.ended
  kyc:
    base-url: ${KYC_BASE_URL:https://kyc.example.test}
    retry:
      max-attempts: 3
      initial-backoff-millis: 200
    circuit-breaker:
      failure-threshold: 5
      open-millis: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
